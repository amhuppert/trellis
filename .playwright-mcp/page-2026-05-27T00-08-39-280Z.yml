            - generic [ref=e973]: CONCEPT INTRO
            - heading "What's the problem MVCC is solving?" [level=2] [ref=e974]
            - generic [ref=e975]:
              - text: A database is a single, shared piece of state. The moment two clients are reading and writing at the same time, the system has to decide whose view of the world is real. Locking is one answer.
              - button "MVCC" [ref=e976]
              - text: is a different one - one that lets readers and writers stop blocking each other entirely, at the cost of carrying many versions of every row.
          - generic [ref=e978]:
            - generic [ref=e979]:
              - img [ref=e981]
              - generic [ref=e983]: MENTAL MODEL
            - heading "The mental model in one sentence" [level=2] [ref=e984]
            - generic [ref=e985]: Each transaction reads from its own snapshot of the database - a frozen moment that ignores anything that hasn't committed yet, and ignores anything that committed after the snapshot was taken.
            - complementary [ref=e986]: "If you remember nothing else from this report, remember this: a Postgres reader never sees a half-written world. The snapshot decides which writes count as visible, even if other transactions are committing wildly around it."
          - complementary [ref=e988]:
            - generic [ref=e989]: i
            - generic [ref=e990]:
              - generic [ref=e991]: Why not just lock?
              - generic [ref=e992]: In a lock-based system, a read takes a shared lock and a write takes an exclusive lock. They wait on each other. Postgres does still take locks, but for visibility, MVCC means readers don't block writers and writers don't block readers.
          - heading "Two ideas, then one design" [level=2] [ref=e994]
          - generic [ref=e995]:
            - text: Two ideas have to land before any of the later sections make sense. The first is that
            - emphasis [ref=e996]: every write makes a new row
            - text: . An UPDATE doesn't change a row in place; it writes a new tuple and marks the old one as superseded. A DELETE doesn't free the row immediately; it marks it as deleted by a particular transaction. The second is that
            - emphasis [ref=e997]: every read carries a snapshot
            - text: ": a small set of transaction ids that the reader considers committed."
          - generic [ref=e999]:
            - generic [ref=e1000]: STEP BY STEP
            - heading "What happens on a single UPDATE" [level=2] [ref=e1001]
            - list [ref=e1002]:
              - listitem [ref=e1003]:
                - generic [ref=e1004]: "1"
                - generic [ref=e1005]:
                  - generic [ref=e1006]: Old tuple stays put
                  - generic [ref=e1007]:
                    - text: Postgres does not overwrite the existing row. Its
                    - button "xmax" [ref=e1008]
                    - text: is stamped with the current transaction's id; physically, it still occupies the same disk page.
              - listitem [ref=e1009]:
                - generic [ref=e1010]: "2"
                - generic [ref=e1011]:
                  - generic [ref=e1012]: New tuple is written
                  - generic [ref=e1013]:
                    - text: A fresh tuple is appended. Its
                    - button "xmin" [ref=e1014]
                    - text: is the current transaction id. Its xmax is zero - it is alive, from its own creator's point of view.
              - listitem [ref=e1015]:
                - generic [ref=e1016]: "3"
                - generic [ref=e1017]:
                  - generic [ref=e1018]: Older readers see the old version
                  - generic [ref=e1019]:
                    - text: Any backend whose
                    - button "snapshot" [ref=e1020]
                    - text: was taken before this transaction committed continues to read the old tuple. It is still there. It is still valid for them.
              - listitem [ref=e1021]:
                - generic [ref=e1022]: "4"
                - generic [ref=e1023]:
                  - generic [ref=e1024]: VACUUM cleans up later
                  - generic [ref=e1025]:
                    - text: Once no live snapshot can possibly need the old tuple,
                    - button "VACUUM" [ref=e1026]
                    - text: reclaims its space. Not before.
          - generic [ref=e1028]:
            - generic [ref=e1029]: KEY TAKEAWAYS
            - list [ref=e1030]:
              - listitem [ref=e1031]:
                - generic [ref=e1033]: MVCC trades space and a janitor for the ability to read without locking writers.
              - listitem [ref=e1034]:
                - generic [ref=e1036]: Every UPDATE is logically a new INSERT plus a tombstone on the old row.
              - listitem [ref=e1037]:
                - generic [ref=e1039]: Visibility is a function of the reader's snapshot, not of the row itself.
              - listitem [ref=e1040]:
                - generic [ref=e1042]: VACUUM is not optional. Postgres' design assumes it runs.
